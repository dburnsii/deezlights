[env:d1_mini]
platform = espressif8266 @ ^4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.ldscript = eagle.flash.4m1m.ld
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    makuna/NeoPixelBus @ ^2.8.0
    greiman/SdFat @ ^2.3.0
build_cache_dir = ./.pio/.buildcache
packages_dir = ./.pio/packages
cache_dir = ./.pio/cache
